name: sync

on:
  schedule:
    # every 30 minutes; the script decides whether a long polling job should run now
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "loop = long polling job, or a single update"
        type: choice
        options: [loop, all, stock, orders]
        default: all
      force:
        description: "Update even if the snapshot is not new"
        type: boolean
        default: true
      any_time:
        description: "Ignore the time window"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  # one long job at a time, the next scheduled one waits in the queue; manual runs do not wait for it
  group: ${{ github.event_name == 'schedule' && 'loop' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
      GOOGLE_KEY_JSON: ${{ secrets.GOOGLE_KEY_JSON }}
      ORDERS_API_KEY: ${{ secrets.ORDERS_API_KEY }}
      DIGEST_JSON: ${{ secrets.DIGEST_JSON }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      NP_KEY: ${{ secrets.NP_KEY }}
      RESTOCK_JSON: ${{ secrets.RESTOCK_JSON }}
      MIRROR_JSON: ${{ secrets.MIRROR_JSON }}
      MODE: ${{ inputs.mode || 'loop' }}
      ANY_TIME: ${{ inputs.any_time && '--any-time' || '' }}
      FORCE: ${{ inputs.force && '--reprocess' || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: deps
        run: pip install -q -r requirements.txt > /dev/null

      - name: window
        id: window
        run: python sync.py --window $ANY_TIME

      - name: server
        if: steps.window.outputs.run == '1'
        run: |
          PW="$(openssl rand -hex 16)Aa1!"
          echo "::add-mask::$PW"
          echo "SQL_PASSWORD=$PW" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/bak" && chmod 777 "$RUNNER_TEMP/bak"
          echo "BACKUP_DIR=$RUNNER_TEMP/bak" >> "$GITHUB_ENV"
          docker run -d --name db -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$PW" -p 1433:1433 \
            -v "$RUNNER_TEMP/bak:/bak" mcr.microsoft.com/mssql/server:2022-latest > /dev/null
          if ! dpkg -s msodbcsql18 > /dev/null 2>&1; then
            curl -sSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb" -o /tmp/p.deb
            sudo dpkg -i /tmp/p.deb > /dev/null
            sudo apt-get update -qq > /dev/null
            sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18 > /dev/null
          fi
          [ -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ] || sudo apt-get install -y -qq fonts-dejavu-core > /dev/null

      - name: update
        if: steps.window.outputs.run == '1'
        run: |
          if [ "$MODE" = "loop" ]; then
            python sync.py --loop --write $ANY_TIME
          else
            python sync.py --write --mode "$MODE" $FORCE $ANY_TIME
          fi

      # scheduled workflows in inactive public repos are paused after 60 days
      - name: keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync.yml/enable" > /dev/null 2>&1 || true
